<div class="issuing-container">
  <div class="issuing-content">
    <div class="page-header">
      <div class="header-content">
        <div class="header-title">
          <h2>Izdavanje knjiga</h2>
          <p class="page-description">
            Upravljanje izdatim, vraćenim knjigama, prekoračenjima i rezervacijama
          </p>
        </div>
        <div class="header-search">
          <input type="text" class="search-input" placeholder="Pretrazi knjige" />
        </div>
      </div>
    </div>

    <nav class="issuing-navbar-horizontal">
      <ul>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['issued']">Izdate knjige</a>
        </li>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['returned']">Vraćene knjige</a>
        </li>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['overdue']">Knjige u prekoračenju</a>
        </li>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['active-reservations']">Aktivne rezervacije</a>
        </li>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['archived-reservations']">Arhivirane rezervacije</a>
        </li>
      </ul>
    </nav>

    <router-outlet></router-outlet>
  </div>
</div>
