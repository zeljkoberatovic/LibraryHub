<div class="spec-container" [formGroup]="bookForm">
  <h3>Specifikacija</h3>

  <div class="grid">
    <!-- Broj strana -->
    <div class="form-group">
      <label for="number_of_pages">Broj strana *</label>
      <input 
        type="number" 
        id="number_of_pages" 
        formControlName="number_of_pages" 
        min="1" 
        placeholder="npr. 200" 
        class="form-control" 
      />
      <div *ngIf="bookForm.get('number_of_pages')?.invalid && bookForm.get('number_of_pages')?.touched" class="error">
        Broj strana je obavezan (minimum 1)
      </div>
    </div>

    <!-- Pismo -->
    <div class="form-group">
      <label for="script">Pismo *</label>
      <select id="script" formControlName="script" class="form-control">
        <option value="">-- Izaberite pismo --</option>
        <option *ngFor="let s of scripts" [value]="s.id">
          {{ s.name }}
        </option>
      </select>
      <div *ngIf="bookForm.get('script')?.invalid && bookForm.get('script')?.touched" class="error">
        Pismo je obavezno
      </div>
    </div>

    <!-- Povez -->
    <div class="form-group">
      <label for="binding">Povez *</label>
      <select id="binding" formControlName="binding" class="form-control">
        <option value="">-- Izaberite povez --</option>
        <option *ngFor="let b of bindings" [value]="b.id">
          {{ b.name }}
        </option>
      </select>
      <div *ngIf="bookForm.get('binding')?.invalid && bookForm.get('binding')?.touched" class="error">
        Povez je obavezan
      </div>
    </div>

    <!-- Format -->
    <div class="form-group">
      <label for="format">Format *</label>
      <select id="format" formControlName="format" class="form-control">
        <option value="">-- Izaberite format --</option>
        <option *ngFor="let f of formats" [value]="f.id">
          {{ f.name }}
        </option>
      </select>
      <div *ngIf="bookForm.get('format')?.invalid && bookForm.get('format')?.touched" class="error">
        Format je obavezan
      </div>
    </div>

    <!-- ISBN -->
    <div class="form-group span-2">
      <label for="isbn">International Standard Book Number *</label>
      <input 
        type="text" 
        id="isbn" 
        formControlName="isbn" 
        placeholder="978-86-521-XXXXX-1" 
        class="form-control" 
      />
      <small class="hint">Dozvoljeni su brojevi i crtice (ISBN-10/13).</small>
      <div *ngIf="bookForm.get('isbn')?.invalid && bookForm.get('isbn')?.touched" class="error">
        ISBN je obavezan i mora biti u validnom formatu
      </div>
    </div>
  </div>
  
  <!-- Dugme za submit -->
  <div class="form-actions">
    
    <button type="submit" (click)="onSubmit()" class="btn-primary" [disabled]="bookForm.invalid">
      Sačuvaj specifikaciju
    </button>
  </div>
</div>
