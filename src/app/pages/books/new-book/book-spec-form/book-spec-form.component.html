<!-- book-spec-form.component.html -->
<form [formGroup]="bookForm" class="book-spec-form">
  <div class="form-header">
    <h3>Specifikacije knjige</h3>
    <p>Tehnički detalji i identifikacija</p>
  </div>

  <div class="form-grid">
    <!-- Broj strana -->
    <div class="form-group">
      <label for="number_of_pages" class="required">Broj strana</label>
      <input
        id="number_of_pages"
        type="number"
        formControlName="number_of_pages"
        placeholder="npr. 256"
        min="1"
        max="5000"
        class="form-control"
        [class.error]="bookForm.get('number_of_pages')?.touched && bookForm.get('number_of_pages')?.invalid">
      <div *ngIf="bookForm.get('number_of_pages')?.touched && bookForm.get('number_of_pages')?.invalid" class="error">
        Broj strana je obavezan (1-5000)
      </div>
    </div>

    <!-- Script -->
    <div class="form-group">
      <label for="script" class="required">Pismo</label>
      <select
        id="script"
        formControlName="script"
        class="form-control"
        [class.error]="bookForm.get('script')?.touched && bookForm.get('script')?.invalid">
        <option value="" disabled selected>Izaberite pismo</option>
        <option *ngFor="let s of scripts" [value]="s.id">{{ s.name }}</option>
      </select>
      <div *ngIf="bookForm.get('script')?.touched && bookForm.get('script')?.invalid" class="error">
        Pismo je obavezno
      </div>
    </div>

    <!-- Binding -->
    <div class="form-group">
      <label for="binding" class="required">Povez</label>
      <select
        id="binding"
        formControlName="binding"
        class="form-control"
        [class.error]="bookForm.get('binding')?.touched && bookForm.get('binding')?.invalid">
        <option value="" disabled selected>Izaberite vrstu poveza</option>
        <option *ngFor="let b of bindings" [value]="b.id">{{ b.name }}</option>
      </select>
      <div *ngIf="bookForm.get('binding')?.touched && bookForm.get('binding')?.invalid" class="error">
        Vrsta poveza je obavezna
      </div>
    </div>

    <!-- ISBN -->
    <div class="form-group full-width">
      <label for="isbn" class="required">ISBN broj</label>
      <input
        id="isbn"
        type="text"
        formControlName="isbn"
        placeholder="npr. 9788661101419"
        class="form-control"
        [class.error]="bookForm.get('isbn')?.touched && bookForm.get('isbn')?.invalid">
      <div *ngIf="bookForm.get('isbn')?.touched && bookForm.get('isbn')?.invalid" class="error">
        Validan ISBN broj je obavezan
      </div>
      <div class="hint">
        Format: 10 ili 13 cifara (npr. 1234567890 ili 9781234567890)
      </div>
    </div>

    <!-- Submit Button -->
    <div class="form-actions">
      <button type="button" (click)="onSubmit()" class="btn btn-primary">
        Dalje → Mediji
      </button>
    </div>
  </div>
</form>
