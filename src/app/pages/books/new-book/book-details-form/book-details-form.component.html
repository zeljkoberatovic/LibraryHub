<div [formGroup]="bookForm" class="book-details-form">

  <label for="name">Naziv knjige*</label>
  <input id="name" formControlName="name" placeholder="Unesite naziv knjige">

  <label for="description">Opis</label>
  <textarea id="description" formControlName="description" placeholder="Opis knjige"></textarea>

  <label for="authors">Autori*</label>
  <select id="authors" formControlName="authors" multiple>
    <option *ngFor="let a of authorsList" [value]="a.id">
      {{ a.first_name }} {{ a.last_name }}
    </option>
  </select>

  <label for="categories">Kategorije*</label>
  <select id="categories" formControlName="categories" multiple>
    <option *ngFor="let c of categoriesList" [value]="c.id">{{ c.name }}</option>
  </select>

  <label for="genres">Žanrovi*</label>
  <select id="genres" formControlName="genres" multiple>
    <option *ngFor="let g of genresList" [value]="g.id">{{ g.name }}</option>
  </select>

  <label for="publishers">Izdavači*</label>
  <select id="publishers" formControlName="publishers" multiple>
    <option *ngFor="let p of publishersList" [value]="p.id">{{ p.name }}</option>
  </select>

  <button type="button" (click)="onSubmit()">Dalje</button>
</div>
