<div class="new-book-container">
  <h2 class="page-title">Nova knjiga</h2>

  <!-- Breadcrumb -->
  <nav class="breadcrumb">
    <a routerLink="/books" class="breadcrumb-link">Evidencija knjiga</a> /
    <span class="breadcrumb-current">Nova knjiga</span>
  </nav>

  <!-- Tabs -->
  <nav class="tab-nav">
    <a [class.active]="activeTab === 'details'" (click)="activeTab='details'" [class.completed]="detailsCompleted">Osnovni detalji</a>
    <a [class.active]="activeTab === 'specification'" (click)="activeTab='specification'" [class.completed]="specCompleted">Specifikacija</a>
    <a [class.active]="activeTab === 'media'" (click)="activeTab='media'" [class.completed]="mediaCompleted">Multimedija</a>
  </nav>

  <!-- Details Form -->
  <div *ngIf="activeTab === 'details'">
    <app-book-details-form 
      [authorsList]="authorsList" 
      [categoriesList]="categoriesList"
      [genresList]="genresList"
      [publishersList]="publishersList"
      (detailsSubmitted)="onDetailsSubmit($event)">
    </app-book-details-form>
  </div>

  <!-- Specification Form -->
  <div *ngIf="activeTab === 'specification'">
    <app-book-spec-form (specSubmitted)="onSpecSubmit($event)"></app-book-spec-form>
  </div>

  <!-- Media Form -->
  <div *ngIf="activeTab === 'media'">
    <app-book-media-form (mediaSubmitted)="onMediaSubmit($event)"></app-book-media-form>
  </div>

  <!-- Save Button -->
  <div class="form-actions">
    <button type="button" class="btn-save" (click)="submitBook()" [disabled]="!detailsCompleted">Sačuvaj knjigu</button>
  </div>
</div>
