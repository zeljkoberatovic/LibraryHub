<div class="new-book-container">
  <!-- Naslov -->
  <h2 class="page-title">Nova knjiga</h2>

  <!-- Breadcrumb navigacija -->
  <nav class="breadcrumb">
    <a routerLink="/books" class="breadcrumb-link">Evidencija knjiga</a> /
    <span class="breadcrumb-current">Nova knjiga</span>
  </nav>

  <!-- Tab navigacija -->
  <nav class="tab-nav">
    <a routerLink="details" routerLinkActive="active-tab" [routerLinkActiveOptions]="{ exact: true }">Osnovni detalji</a>
    <a routerLink="specification" routerLinkActive="active-tab">Specifikacija</a>
    <a routerLink="media" routerLinkActive="active-tab">Multimedija</a>
  </nav>

  
  <router-outlet></router-outlet>
</div>
