<div class="book-card">
  <div class="header">
    <div class="left">
      <span class="book-name">{{ book?.name }}</span>
      <span class="book-info">Evidencija {{ book?.number_of_copies }} / {{ book?.isbn }}</span>
    </div>

    <div class="right-wrapper">
      <div class="actions">

        <a class="action-btn" routerLink="reserve"><i class="fa-solid fa-calendar-check"></i> Rezerviši knjigu</a>
      </div>

      <div class="right">
        <button class="dots" (click)="toggleDropdown()">⋮</button>
        @if (dropdownOpen) {
          <div class="dropdown">
            <a (click)="closeDropdown()">Pogledaj knjigu</a>
            <a (click)="closeDropdown()">Izmijeni knjigu</a>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="navbar-wrapper">
    <div class="book-navbar">
      <nav class="nav-links">
        <a routerLink="details" routerLinkActive="active" class="nav-item">Osnovni detalji</a>
        <a routerLink="specification" routerLinkActive="active" class="nav-item">Specifikacija</a>
        <a routerLink="records" routerLinkActive="active" class="nav-item">Evidencija iznajmljivanja</a>
        <a routerLink="media" routerLinkActive="active" class="nav-item">Multimedia</a>
      </nav>

      <div class="book-content">
        <router-outlet></router-outlet>
      </div>
    </div>

    <div class="navbar-extra">
      <div class="actions-placeholder">
        <p>Detalji knjige</p>
      </div>
    </div>
  </div>
</div>

<!-- Primjer: rented.component.html -->
<tr *ngFor="let rental of rentedCopies">
  <td>{{ rental.user }}</td>
  <td>{{ rental.date }}</td>
  <td>
    <a [routerLink]="['../', rental.id, 'lost']">Otpiši</a>
    <a [routerLink]="['../', rental.id, 'return']">Vrati</a>
  </td>
</tr>
