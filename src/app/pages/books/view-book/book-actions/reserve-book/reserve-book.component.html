@if (successMessage) {
  <div class="alert alert-success">{{ successMessage }}</div>
}
@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

<form (ngSubmit)="reserve()" #reserveForm="ngForm" class="reserve-container">
  <div class="form-group">
    <label for="student">Izaberi učenika:</label>
    <select
      id="student"
      name="student"
      class="form-control"
      required
      [(ngModel)]="selectedStudentId"
    >
      <option value="" disabled selected>-- Izaberi učenika --</option>
      <option *ngFor="let student of students" [value]="student.id">
        {{ student.first_name }} {{ student.last_name }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label for="reservationDate">Datum rezervacije:</label>
    <input
      id="reservationDate"
      name="reservationDate"
      type="date"
      class="form-control"
      required
      [(ngModel)]="reservationDate"
    />
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="!selectedStudentId || !reservationDate"
  >
    Rezerviši knjigu
  </button>
</form>
