<div class="edit-container">
  <h2>Izmjena studenta</h2>

  <div *ngIf="student; else loading" class="edit-content">

    <!-- Slika sa leve strane -->
    <div class="profile-picture-section">
      <div *ngIf="student.profile_picture || selectedFile">
        <p>Profilna slika:</p>
      </div>

      <div *ngIf="selectedFile; else existingPicture">
        <img [src]="photoPreview" alt="Preview slike" class="profile-picture" />
      </div>

      <ng-template #existingPicture>
        <div *ngIf="student.profile_picture; else noPicture">
          <img [src]="student.profile_picture" alt="Trenutna profilna slika" class="profile-picture" />
        </div>
        <ng-template #noPicture>
          <p>Nema profilne slike.</p>
        </ng-template>
      </ng-template>
    </div>

    <!-- Forma sa desne strane -->
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" novalidate class="edit-form">
      <div class="form-group">
        <label for="first_name">Ime</label>
        <input id="first_name" formControlName="first_name" />
      </div>

      <div class="form-group">
        <label for="last_name">Prezime</label>
        <input id="last_name" formControlName="last_name" />
      </div>

      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input id="username" formControlName="username" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label for="jmbg">JMBG</label>
        <input id="jmbg" formControlName="jmbg" />
      </div>

      <div class="form-group">
        <label>Izmijeni profilnu sliku</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      </div>

      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <button type="submit" [disabled]="studentForm.invalid" class="save-btn">Sačuvaj izmjene</button>
    </form>

  </div>

  <ng-template #loading>
    <div class="loading">Učitavanje podataka o studentu...</div>
  </ng-template>
</div>
