<div class="container">
  <div class="header-with-search">
    <h2>Studenti</h2>
    <input
      type="text"
      placeholder="Pretraži..."
      [(ngModel)]="searchTerm"
      class="search-input"
    />
  </div>

  <button class="add-button" [routerLink]="['/students/new']">+ Novi student</button>

  <table>
    <thead>
      <tr>
        <th></th>
        <th (click)="sortByName()" style="cursor: pointer;">
          Ime i prezime
          <span [ngClass]="sortDirection === 'asc' ? 'arrow down' : 'arrow up'"></span>
        </th>
        <th>Email</th>
        <th>Tip korisnika</th>
        <th>Zadnji pristup</th>
        <th></th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let student of pagedStudents; let i = index">
        <td>
          <img
            [src]="student.profile_picture || 'assets/default-user.png'"
            alt="Profilna slika"
            class="avatar"
          />
        </td>
        <td>{{ student.first_name }} {{ student.last_name }}</td>
        <td>{{ student.email }}</td>
        <td>Student</td>
        <td>{{ student.last_login || 'Nikada' }}</td>
        <td class="actions-cell" style="position: relative;">
          <span class="menu-icon" (click)="toggleMenu(i)">⋮</span>

          <div class="menu" *ngIf="openMenuIndex === i">
            <button (click)="showDetails(student)">
              <span class="material-icons" style="font-size:16px; vertical-align: middle;">info</span> Detalji korisnika
            </button>
            <button (click)="editUser(student)">
              <span class="material-icons" style="font-size:16px; vertical-align: middle;">edit</span> Izmijeni korisnika
            </button>
            <button (click)="deleteUser(student)">
              <span class="material-icons" style="font-size:16px; vertical-align: middle;">delete</span> Izbriši korisnika
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <app-pagination
    [totalPages]="pagination.totalPages"
    [currentPage]="pagination.currentPage"
    (pageChange)="onPageChange($event)"
  ></app-pagination>
</div>
