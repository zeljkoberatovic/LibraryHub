<div class="px-6 py-4">
  <div class="flex justify-between items-center mb-6">
    <button
      (click)="onNew()"
      class="bg-[#4558BE] hover:bg-[#3F51B5] text-white px-4 py-2 rounded shadow"
    >
      + Novi izdavač
    </button>
  </div>

  @if (showForm) {
<div class="mb-6 bg-white shadow rounded p-6">
    <h2 class="text-xl font-medium mb-4">
      {{ editingId ? "Edit Publisher" : "New Publisher" }}
    </h2>
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="grid gap-4 md:grid-cols-2"
    >
      <div>
        <label class="block mb-1 font-medium">Name*</label>
        <input
          formControlName="name"
          class="w-full border border-gray-300 rounded px-3 py-2"
        />
      </div>

      <div class="md:col-span-2 flex space-x-3 mt-4">
        <button
          type="submit"
          class="bg-[#4558BE] hover:bg-[#3F51B5] text-white px-4 py-2 rounded"
        >
          {{ editingId ? "Update" : "Create" }}
        </button>
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 border rounded"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
}

  <div class="bg-white shadow rounded overflow-hidden">
    <table class="min-w-full">
      <thead class="bg-gray-100">
        <tr>
          <th class="p-4"><input type="checkbox" /></th>
          <th class="p-4 text-left font-medium">Naziv izdavača</th>
          <th class="p-4"></th>
        </tr>
      </thead>
      <tbody>
        @for (p of publishers; track p) {
<tr class="border-t hover:bg-gray-50">
          <td class="p-4"><input type="checkbox" /></td>
          <td class="p-4">{{ p.name }}</td>
          <td class="p-4 text-right">
            <button (click)="onEdit(p)">
              <i
                class="fas fa-ellipsis-v text-gray-500 hover:text-gray-700"
              ></i>
            </button>
          </td>
        </tr>
}
      </tbody>
    </table>
  </div>
</div>
