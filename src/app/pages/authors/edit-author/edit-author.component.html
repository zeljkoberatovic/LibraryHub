<div class="edit-container">
  <h2><i class="fas fa-user-edit"></i> Izmjena autora</h2>

  <div *ngIf="author; else loading" class="edit-content">
    <!-- Slika sa leve strane -->
    <div class="profile-picture-section">
      <div *ngIf="author.picture || selectedFile">
        <p>Profilna slika:</p>
      </div>

      <div *ngIf="selectedFile; else existingPicture">
        <img
          [src]="photoPreview"
          alt="Preview slike"
          class="profile-picture"
        />
      </div>

      <ng-template #existingPicture>
        <div *ngIf="author.picture; else noPicture">
          <img
            [src]="author.picture"
            alt="Trenutna profilna slika"
            class="profile-picture"
          />
        </div>
        
        <ng-template #noPicture>
          <p>Nema profilne slike.</p>
        </ng-template>
      </ng-template>
    </div>

    <!-- Forma sa desne strane -->
    <form [formGroup]="form" (ngSubmit)="save()" novalidate class="edit-form">
      <div class="form-group">
        <label for="first_name"><i class="fas fa-signature"></i> Ime</label>
        <input id="first_name" formControlName="first_name" />
        <div *ngIf="form.get('first_name')?.invalid && form.get('first_name')?.touched" class="error-text">
          Ime je obavezno i mora imati najmanje 2 karaktera.
        </div>
      </div>

      <div class="form-group">
        <label for="last_name"><i class="fas fa-signature"></i> Prezime</label>
        <input id="last_name" formControlName="last_name" />
        <div *ngIf="form.get('last_name')?.invalid && form.get('last_name')?.touched" class="error-text">
          Prezime je obavezno i mora imati najmanje 2 karaktera.
        </div>
      </div>

      <div class="form-group">
        <label for="biography"><i class="fas fa-book-open"></i> Biografija</label>
        <textarea id="biography" formControlName="biography"></textarea>
        <div *ngIf="form.get('biography')?.invalid && form.get('biography')?.touched" class="error-text">
          Biografija je obavezna i mora imati najmanje 10 karaktera.
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-camera"></i> Izmijeni profilnu sliku</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="form.invalid" class="save-btn">
        <i class="fas fa-save"></i> Sačuvaj izmjene
      </button>
    </form>
  </div>

  <ng-template #loading>
    <div class="loading">
      <i class="fas fa-spinner fa-spin"></i> Učitavanje podataka o autoru...
    </div>
  </ng-template>
</div>
