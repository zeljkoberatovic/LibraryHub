<div class="edit-container">
  <h2>Izmjena autora</h2>

  <div class="edit-content">
    <!-- Slika sa leve strane -->
    <div class="profile-picture-section">
      @if (author?.picture || selectedFile) {
        <p>Profilna slika:</p>
      }

      @if (selectedFile) {
        <img
          [src]="photoPreview"
          alt="Preview slike"
          class="profile-picture"
        />
      } @else {

        @if (author?.picture) {
          <img
            [src]="author?.picture"
            alt="Trenutna profilna slika"
            class="profile-picture"
          />
        }
        
        @if (!author?.picture) {
          <p>Nema profilne slike.</p>
        }
      
      }
    </div>

    <!-- Forma sa desne strane -->
    <form [formGroup]="form" (ngSubmit)="save()" novalidate class="edit-form">
      <div class="form-group">
        <label for="first_name">Ime</label>
        <input id="first_name" formControlName="first_name" />
      </div>

      <div class="form-group">
        <label for="last_name">Prezime</label>
        <input id="last_name" formControlName="last_name" />
      </div>

      <div class="form-group">
        <label for="biography">Biografija</label>
        <textarea id="biography" formControlName="biography"></textarea>
      </div>

      <div class="form-group">
        <label>Izmijeni profilnu sliku</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      </div>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="form.invalid" class="save-btn">Sačuvaj izmjene</button>
    </form>
  </div>
</div>
