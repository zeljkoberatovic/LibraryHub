<div class="container">
  <div class="header">
    <h2>Bibliotekari</h2>
  </div>

  <div class="toolbar">
    <button class="add-button" routerLink="/noviBibliotekar">+ Novi bibliotekar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th></th>
        <th (click)="sortByName()" style="cursor: pointer;">
          Ime i prezime
          <span [ngClass]="sortDirection === 'asc' ? 'arrow down' : 'arrow up'"></span>
        </th>
        <th>Email</th>
        <th>Tip korisnika</th>
        <th>Zadnji pristup</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let librarian of filterLibrarians()">
        <td><img [src]="librarian.profile_picture || 'assets/default-user.png'" class="avatar" /></td>
        <td>{{ librarian.first_name }} {{ librarian.last_name }}</td>
        <td>{{ librarian.email }}</td>
        <td>Bibliotekar</td>
        <td>{{ librarian.last_login || 'Nikada' }}</td>
        <td><span class="menu-icon">⋮</span></td>
      </tr>
    </tbody>
  </table>
</div>
