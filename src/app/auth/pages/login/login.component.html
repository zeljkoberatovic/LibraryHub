<div class="login-container">
  <div class="login-top-links">
    <a routerLink="/register" class="top-link">
      <i class="fas fa-user-plus"></i>
      Registracija
    </a>
  </div>
  <div class="login-card">

    <div class="login-header">
      <div class="logo">
        <i class="fas fa-book-open"></i>
        <h1>Digitalna biblioteka</h1>
      </div>
      <h2>Dobrodošli</h2>
      <p>Prijavite se na svoj nalog</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="login()" class="login-form">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email">Email adresa</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            [(ngModel)]="credentials.email"
            name="email"
            required
            placeholder="Unesite vaš email"
            [disabled]="isLoading"
            class="form-control"
            >
          </div>
        </div>


        <div class="form-group">
          <label for="password">Lozinka</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="password"
              [(ngModel)]="credentials.password"
              name="password"
              required
              placeholder="Unesite vašu lozinku"
              [disabled]="isLoading"
              class="form-control"
              >
            </div>
          </div>


          @if (errorMessage) {
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              <span>{{ errorMessage }}</span>
            </div>
          }


          <button
            type="submit"
            [disabled]="isLoading"
            class="login-btn"
            >
            @if (!isLoading) {
              <span>
                <i class="fas fa-sign-in-alt"></i>
                Prijavi se
              </span>
            }
            @if (isLoading) {
              <span>
                <i class="fas fa-spinner fa-spin"></i>
                Prijavljujem...
              </span>
            }
          </button>
        </form>

        <!-- Test Users (samo za development) -->
        @if (!isLoading) {
          <div class="test-users">
            <h4>Testni korisnici:</h4>
            <div class="test-buttons">
              @for (user of testUsers; track user; let i = $index) {
                <button
                  (click)="quickLogin(i)"
                  class="test-btn"
                  [title]="user.email"
                  >
                  <i class="fas fa-user"></i>
                  {{ user.name }}
                </button>
              }
            </div>
          </div>
        }


        <div class="login-footer">
          <p>Nemate nalog? <a routerLink="/register" class="register-link">Registrujte se ovdje</a></p>
        </div>
      </div>
    </div>
