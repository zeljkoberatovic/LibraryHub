<div class="app-container" [class.collapsed-sidebar]="isSidebarCollapsed">
  <app-header></app-header>
  @if (isLoggedIn$ | async) {
    <app-sidebar
      [collapsed]="isSidebarCollapsed"
      (toggle)="isSidebarCollapsed = !isSidebarCollapsed">
    </app-sidebar>
  }

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
